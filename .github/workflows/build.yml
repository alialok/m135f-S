name: Build WiFi Modules

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4

    - name: Install Dependencies & Cross Compiler
      run: |
        sudo apt update
        sudo apt install -y build-essential bc libncurses5-dev libssl-dev bison flex libelf-dev \
                            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

    - name: Configure Drivers
      run: |
        # 1. تعيين المعمارية والمترجم
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-

        # 2. إنشاء ملف الإعدادات المبدئي للهاتف
        CONF=$(find arch/arm64/configs/ -name "*m13*" -o -name "*exynos850*" 2>/dev/null | head -n 1 | xargs basename)
        if [ -z "$CONF" ]; then CONF="exynos850-m13xx_defconfig"; fi
        
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- $CONF

        # 3. تفعيل تعاريف الواي فاي بأسلوب الكرنل الرسمي
        scripts/config --enable CONFIG_NETDEVICES
        scripts/config --enable CONFIG_WLAN
        scripts/config --module CONFIG_MT7601U
        scripts/config --module CONFIG_RT2800USB
        scripts/config --enable CONFIG_RT2800USB_RT53XX

    - name: Build WiFi Modules
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-

        # تجهيز الأدوات والرموز
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- prepare
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- modules_prepare
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- scripts

        # تجميع موديولات الواي فاي فقط
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- M=drivers/net/wireless modules -j$(nproc)

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: M135F-WiFi-Modules
        path: |
          drivers/net/wireless/**/*.ko
          drivers/net/wireless/*.ko
