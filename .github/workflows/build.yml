name: Build WiFi Modules

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4

    - name: Download Google Clang Toolchain
      run: |
        sudo apt update
        sudo apt install -y build-essential bc libncurses5-dev libssl-dev bison flex libelf-dev
        git clone https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 --depth=1 -b master-kernel-build-2022 $HOME/clang

    - name: Configure Drivers
      run: |
        export PATH="$HOME/clang/clang-r450708d/bin:$PATH"
        
        # البحث عن ملف التكوين المناسب لـ exynos850
        CONF=$(find arch/arm64/configs/ arch/arm/configs/ -name "*m13*" -o -name "*exynos850*" 2>/dev/null | head -n 1 | xargs basename)
        if [ -z "$CONF" ]; then CONF="exynos850_defconfig"; fi
        
        make ARCH=arm64 CC=clang LLVM=1 $CONF || true
        
        # تفعيل كروت الواي فاي كـ Modules
        echo "CONFIG_MT7601U=m" >> .config
        echo "CONFIG_RT2800USB=m" >> .config
        echo "CONFIG_RT2800USB_RT53XX=y" >> .config

    - name: Build WiFi Modules
      run: |
        export PATH="$HOME/clang/clang-r450708d/bin:$PATH"
        make ARCH=arm64 CC=clang LLVM=1 modules_prepare || true
        make ARCH=arm64 CC=clang LLVM=1 M=drivers/net/wireless modules -j$(nproc) || true

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: M135F-WiFi-Modules
        path: drivers/net/wireless/**/*.ko
